<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería – XV Años Jhamile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #f86eec;
      --pink-deep: #c030b8;
      --gold: #ff0000;
      --gold-light: #ff7a7a;
      --green-btn: #7ED957;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #fce4fa 0%, #f5a8ef 30%, #f0c0f8 60%, #fde8fc 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* particles */
    .particles { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .particle { position:absolute; border-radius:50%; opacity:0.15; animation: floatUp linear infinite; }
    @keyframes floatUp { 0%{transform:translateY(110vh) rotate(0deg);opacity:0;} 10%{opacity:0.15;} 90%{opacity:0.15;} 100%{transform:translateY(-10vh) rotate(720deg);opacity:0;} }

    /* butterflies */
    .butterflies { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .butterfly { position:absolute; animation: flyPath linear infinite; }
    .butterfly svg { width:100%; height:100%; animation: flapWings ease-in-out infinite; transform-origin:center; }
    @keyframes flapWings {
      0%,100%{ transform:scaleX(1); }
      25%    { transform:scaleX(0.2); }
      50%    { transform:scaleX(1); }
      75%    { transform:scaleX(0.2); }
    }
    @keyframes flyPath {
      0%  { transform:translate(-60px,110vh) rotate(-10deg); opacity:0; }
      5%  { opacity:1; }
      25% { transform:translate(20vw,70vh) rotate(8deg); }
      50% { transform:translate(50vw,30vh) rotate(-6deg); }
      75% { transform:translate(75vw,55vh) rotate(10deg); }
      95%  { opacity:1; }
      100% { transform:translate(110vw,10vh) rotate(-5deg); opacity:0; }
    }

    header {
      position: relative; z-index:1;
      text-align: center;
      padding: 60px 20px 30px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,215,0,0.3);
      color: var(--gold);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 100px;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
      margin-bottom: 30px;
    }
    .back-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.2); }

    .gallery-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: var(--gold);
      text-shadow: 0 0 30px rgba(255,215,0,0.4);
    }

    .gallery-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--gold-light);
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .divider {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px auto;
    }

    /* upload bar */
    .upload-bar {
      position: relative; z-index:1;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 0 20px 40px;
    }

    .btn-green {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--green-btn), #a3e26b);
      color: #2a5500;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(126,217,87,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-green:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 14px 40px rgba(126,217,87,0.5); }

    /* grid */
    .gallery-grid {
      position: relative; z-index:1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 0 24px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,215,0,0.2);
      box-shadow: 0 8px 30px rgba(100,0,100,0.2);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      aspect-ratio: 1;
    }
    .gallery-item:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 50px rgba(100,0,100,0.35); }

    .gallery-item img,
    .gallery-item video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(100,0,100,0.65));
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    .gallery-item:hover .item-overlay { opacity: 1; }

    .item-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--gold-light);
      font-size: 0.9rem;
    }

    .item-delete {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(180,0,80,0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      font-size: 0.8rem;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .gallery-item:hover .item-delete { display: flex; }
    .item-delete:hover { background: rgba(200,0,50,1); }

    .video-play-icon {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 2.5rem;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
    }

    /* empty state */
    .empty-state {
      position: relative; z-index:1;
      text-align: center;
      padding: 60px 20px;
      display: none;
    }
    .empty-state.show { display: block; }
    .empty-icon { font-size: 4rem; margin-bottom: 20px; }
    .empty-title { font-family:'Great Vibes',cursive; font-size:2.5rem; color:var(--gold); margin-bottom:12px; }
    .empty-text { font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-light); font-size:1.1rem; }

    /* lightbox */
    .lightbox {
      position: fixed; inset:0;
      background: rgba(40,0,50,0.92);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .lightbox.active { opacity:1; pointer-events:all; }

    .lightbox-inner {
      max-width: 90vw;
      max-height: 88vh;
      position: relative;
    }

    .lightbox-inner img,
    .lightbox-inner video {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    }

    .lightbox-close {
      position: absolute;
      top: -44px; right: 0;
      background: none; border: none;
      color: var(--gold);
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .lightbox-close:hover { transform: scale(1.2); }

    /* hidden file input */
    #hiddenFileInput { display:none; }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(60,0,70,0.9);
      border: 1px solid rgba(255,215,0,0.4);
      color: var(--gold-light);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      padding: 12px 28px;
      border-radius: 100px;
      z-index: 300;
      transition: transform 0.4s;
      backdrop-filter: blur(8px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    footer {
      position: relative; z-index:1;
      text-align: center;
      padding: 30px 20px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: rgba(255,215,0,0.55);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255,215,0,0.12);
    }

    @media (max-width:500px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap:12px; padding: 0 12px 40px; }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>
  <div class="butterflies" id="butterflies"></div>

  <header>
    <a href="index.html" class="back-btn">← Volver a la Invitación</a>
    <div class="gallery-title">Galería de Recuerdos</div>
    <div class="gallery-sub">Los momentos más especiales de nuestra quinceañera 👑</div>
    <div class="divider"></div>
  </header>

  <div class="upload-bar">
    <button class="btn-green" onclick="document.getElementById('hiddenFileInput').click()">
      📷 Subir Fotos / Videos
    </button>
  </div>

  <input type="file" id="hiddenFileInput" accept="image/*,video/*" multiple onchange="handleFiles(this.files)">

  <div class="gallery-grid" id="grid"></div>
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📷</div>
    <div class="empty-title">¡Aún no hay recuerdos!</div>
    <p class="empty-text">Sube fotos o videos de la fiesta<br>y aparecerán aquí para todos verlos.</p>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner" id="lightboxInner">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    ✦ XV Años de Jhamile Russell · Galería de Recuerdos ✦
  </footer>

  <script>
    /* ── PARTICLES ── */
    const pc=document.getElementById('particles');
    const cols=['#f9d0f7','#fce08a','#f86eec','#fff'];
    for(let i=0;i<20;i++){
      const d=document.createElement('div');d.className='particle';
      const sz=Math.random()*40+15;
      d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*10}s;`;
      pc.appendChild(d);
    }

    /* ── BUTTERFLIES ── */
    const bc = document.getElementById('butterflies');
    const bfColors = [
      ['#e040d0','#f9a8f0'],
      ['#FFD700','#FFE97A'],
      ['#ff85ea','#ffc8f8'],
      ['#c030b8','#e870dc'],
      ['#fff','#fde8fc'],
    ];
    for(let i = 0; i < 8; i++){
      const col = bfColors[Math.floor(Math.random()*bfColors.length)];
      const size = Math.random()*28+22;
      const duration = Math.random()*18+16;
      const delay = Math.random()*20;
      const flapDur = Math.random()*0.4+0.25;
      const wrapper = document.createElement('div');
      wrapper.className = 'butterfly';
      wrapper.style.cssText=`width:${size}px;height:${size}px;animation-duration:${duration}s;animation-delay:-${delay}s;top:${Math.random()*80}%;`;
      wrapper.innerHTML=`<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" style="animation-duration:${flapDur}s;">
        <ellipse cx="30" cy="20" rx="28" ry="18" fill="${col[0]}" opacity="0.82"/>
        <ellipse cx="25" cy="42" rx="20" ry="13" fill="${col[0]}" opacity="0.72"/>
        <ellipse cx="70" cy="20" rx="28" ry="18" fill="${col[1]}" opacity="0.82"/>
        <ellipse cx="75" cy="42" rx="20" ry="13" fill="${col[1]}" opacity="0.72"/>
        <ellipse cx="50" cy="30" rx="4" ry="20" fill="#6b006b" opacity="0.7"/>
        <line x1="48" y1="12" x2="36" y2="2" stroke="#6b006b" stroke-width="1.5" opacity="0.6"/>
        <line x1="52" y1="12" x2="64" y2="2" stroke="#6b006b" stroke-width="1.5" opacity="0.6"/>
        <circle cx="36" cy="2" r="2" fill="#6b006b" opacity="0.6"/>
        <circle cx="64" cy="2" r="2" fill="#6b006b" opacity="0.6"/>
        <ellipse cx="26" cy="18" rx="10" ry="6" fill="white" opacity="0.18"/>
        <ellipse cx="74" cy="18" rx="10" ry="6" fill="white" opacity="0.18"/>
      </svg>`;
      bc.appendChild(wrapper);
    }

    /* ── GALLERY ── */
    const grid=document.getElementById('grid');
    const emptyState=document.getElementById('emptyState');
    let items=[];

    function loadGallery(){
      items=JSON.parse(localStorage.getItem('xv_gallery')||'[]');
      renderGrid();
    }

    function renderGrid(){
      grid.innerHTML='';
      if(items.length===0){ emptyState.classList.add('show'); return; }
      emptyState.classList.remove('show');
      items.forEach((item,i)=>{
        const el=document.createElement('div');
        el.className='gallery-item';

        const isVideo=item.type.startsWith('video');
        let media;
        if(isVideo){
          media=document.createElement('video');
          media.src=item.data;
          media.muted=true;
          media.loop=true;
          el.addEventListener('mouseenter',()=>media.play());
          el.addEventListener('mouseleave',()=>{ media.pause(); media.currentTime=0; });
          const playIcon=document.createElement('div');
          playIcon.className='video-play-icon';
          playIcon.textContent='▶';
          el.appendChild(playIcon);
        } else {
          media=document.createElement('img');
          media.src=item.data;
          media.alt=item.name;
        }
        el.appendChild(media);

        // overlay
        const ov=document.createElement('div');
        ov.className='item-overlay';
        const nm=document.createElement('div');
        nm.className='item-name';
        nm.textContent=item.name;
        ov.appendChild(nm);
        el.appendChild(ov);

        // delete btn
        const del=document.createElement('button');
        del.className='item-delete';
        del.innerHTML='✕';
        del.onclick=(e)=>{ e.stopPropagation(); deleteItem(i); };
        el.appendChild(del);

        el.addEventListener('click',()=>openLightbox(item));
        grid.appendChild(el);
      });
    }

    function deleteItem(i){
      items.splice(i,1);
      localStorage.setItem('xv_gallery',JSON.stringify(items));
      renderGrid();
      showToast('Archivo eliminado');
    }

    function clearAll(){
      if(!confirm('¿Eliminar todos los archivos de la galería?')) return;
      items=[];
      localStorage.removeItem('xv_gallery');
      renderGrid();
      showToast('Galería limpiada');
    }

    function handleFiles(files){
      if(!files||files.length===0) return;
      let count=0;
      Array.from(files).forEach(file=>{
        if(file.size>50*1024*1024){ showToast(`"${file.name}" supera los 50MB`); return; }
        const reader=new FileReader();
        reader.onload=function(e){
          items.push({name:file.name,type:file.type,data:e.target.result,date:new Date().toISOString()});
          count++;
          if(count===files.length){
            localStorage.setItem('xv_gallery',JSON.stringify(items));
            renderGrid();
            showToast(`✅ ${count} archivo(s) guardado(s)`);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    /* ── LIGHTBOX ── */
    function openLightbox(item){
      const lb=document.getElementById('lightbox');
      const inner=document.getElementById('lightboxInner');
      // remove previous media (keep close btn)
      const prev=inner.querySelector('img,video');
      if(prev) prev.remove();

      const isVideo=item.type.startsWith('video');
      let m;
      if(isVideo){
        m=document.createElement('video');
        m.src=item.data;
        m.controls=true;
        m.autoplay=true;
      } else {
        m=document.createElement('img');
        m.src=item.data;
        m.alt=item.name;
      }
      inner.appendChild(m);
      lb.classList.add('active');
    }

    function closeLightbox(){
      const lb=document.getElementById('lightbox');
      lb.classList.remove('active');
      const vid=lb.querySelector('video');
      if(vid){ vid.pause(); }
    }

    document.getElementById('lightbox').addEventListener('click',function(e){
      if(e.target===this) closeLightbox();
    });

    /* ── TOAST ── */
    function showToast(msg){
      const t=document.getElementById('toast');
      t.textContent=msg;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),3000);
    }

    loadGallery();
  </script>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG (pega la tuya aquí)
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_BUCKET",
  messagingSenderId: "TU_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getFirestore(app);

// SUBIR ARCHIVOS
window.handleFiles = async function(files){
  if(!files.length) return;

  for(const file of files){
    const storageRef = ref(storage, 'galeria/' + Date.now() + "_" + file.name);

    // subir archivo
    await uploadBytes(storageRef, file);

    // obtener URL
    const url = await getDownloadURL(storageRef);

    // guardar en Firestore
    await addDoc(collection(db, "fotos"), {
      name: file.name,
      url: url,
      type: file.type,
      date: new Date()
    });
  }

  alert("✅ Archivos subidos correctamente");
};
</script>
</body>
</html>
